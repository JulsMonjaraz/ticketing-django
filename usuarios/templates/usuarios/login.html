{% extends 'eventos/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
    <div class="detalle-container" style="max-width:500px; margin:0 auto;">
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Entrar</button>
        </form>
        <p style="margin-top:15px;">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
    </div>
{% endblock %}
