{% extends 'eventos/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div style="max-width:440px; margin:40px auto; background:#ffffff; border:1px solid #e9e5f5; border-radius:20px; padding:40px; box-shadow:0 8px 24px rgba(167,139,250,0.12); animation: slideUp 0.5s ease;">
    <h1 style="text-align:center;">Iniciar sesión</h1>
    <p style="text-align:center; color:#8b8a9e; margin-bottom:24px;">Accede a tu cuenta</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
    </form>
    <p style="text-align:center; margin-top:16px; color:#8b8a9e; font-size:0.875rem;">
        ¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}" style="color:#8b5cf6; font-weight:600;">Regístrate</a>
    </p>
</div>
{% endblock %}
