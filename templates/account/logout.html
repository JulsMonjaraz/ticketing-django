{% extends 'eventos/base.html' %}

{% block titulo %}Cerrar sesión{% endblock %}

{% block contenido %}
<div style="max-width:440px; margin:40px auto; background:#ffffff; border:1px solid #e9e5f5; border-radius:20px; padding:40px; box-shadow:0 8px 24px rgba(167,139,250,0.12); text-align:center;">
    <h1>¿Cerrar sesión?</h1>
    <p style="color:#8b8a9e; margin:16px 0;">Estás a punto de cerrar tu sesión.</p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn" style="width:100%;">Sí, cerrar sesión</button>
    </form>

    <p style="margin-top:16px; color:#8b8a9e; font-size:0.875rem;">
        <a href="{% url 'eventos:lista' %}" style="color:#8b5cf6; font-weight:600;">Cancelar</a>
    </p>
</div>
{% endblock %}
