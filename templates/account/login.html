{% extends 'eventos/base.html' %}
{% load socialaccount %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div style="max-width:440px; margin:40px auto; background:#ffffff; border:1px solid #e9e5f5; border-radius:20px; padding:40px; box-shadow:0 8px 24px rgba(167,139,250,0.12);">
    <h1 style="text-align:center;">Iniciar sesión</h1>
    <p style="text-align:center; color:#8b8a9e; margin-bottom:24px;">Accede a tu cuenta</p>

    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%;">Entrar</button>
    </form>

    <div style="text-align:center; margin:20px 0; color:#8b8a9e;">— o —</div>

    <a href="{% provider_login_url 'google' %}" style="
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 24px;
    border: 1.5px solid #e9e5f5;
    border-radius: 10px;
    background: #ffffff;
    color: #3f3d56;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    font-family: inherit;
    transition: all 0.2s ease;
" onmouseover="this.style.borderColor='#a78bfa'; this.style.background='#faf8ff';" onmouseout="this.style.borderColor='#e9e5f5'; this.style.background='#ffffff';">
    <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
    </svg>
    Continuar con Google
</a>

    <p style="text-align:center; margin-top:16px; color:#8b8a9e; font-size:0.875rem;">
        ¿No tienes cuenta? <a href="{% url 'account_signup' %}" style="color:#8b5cf6; font-weight:600;">Regístrate</a>
    </p>
</div>
{% endblock %}
